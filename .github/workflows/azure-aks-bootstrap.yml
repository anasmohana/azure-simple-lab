name: azure-aks-bootstrap
run-name: "azure-aks-bootstrap · ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prd
      plan_vars:
        description: "Optional -var flags (e.g. -var enabled=true to deploy a code-only layer)."
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  run-terraform:
    uses: ./.github/workflows/terraform-workflow-template.yml
    with:
      layer: aks-bootstrap
      environment: ${{ inputs.environment }}
      plan_vars: ${{ inputs.plan_vars }}
    secrets: inherit
