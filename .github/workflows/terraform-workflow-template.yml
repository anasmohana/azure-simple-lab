name: terraform-workflow-template

# Reusable: plan -> manual approval -> apply for ONE layer in ONE environment.
on:
  workflow_call:
    inputs:
      layer:
        description: "Layer folder under terraform/ (bootstrap, network, runner, aks, aks-bootstrap)"
        required: true
        type: string
      environment:
        description: "Target environment (dev, prd)"
        required: true
        type: string
      target_flags:
        description: "Optional -target flags, e.g. for a two-phase bootstrap. Empty = full apply."
        required: false
        type: string
        default: ""
      apply_options:
        description: "Optional flags for terraform apply (e.g. -parallelism=1)."
        required: false
        type: string
        default: ""
      plan_vars:
        description: "Optional -var flags appended to terraform plan (e.g. -var enabled=true)."
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: terraform/${{ inputs.layer }}/${{ inputs.environment }}
  TF_VERSION: "1.11.4"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    # <env>-plan has its own federated credential, so a plan token can't be replayed as an apply
    environment: ${{ inputs.environment }}-plan
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      # JSON list, e.g. ["203.0.113.7/32"]; only the aks layer declares this variable
      TF_VAR_authorized_ip_ranges: ${{ vars.AKS_AUTHORIZED_IPS || '[]' }}
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Allow private module repo
        run: git config --global url."https://x-access-token:${{ secrets.MODULES_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_TARGET_FLAGS: ${{ inputs.target_flags }}
          TF_PLAN_VARS: ${{ inputs.plan_vars }}
        run: |
          terraform plan -out=tfplan -input=false -lock-timeout=5m $TF_TARGET_FLAGS $TF_PLAN_VARS
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          CHANGES=$(jq '[.resource_changes[] | select(.change.actions | index("create","update","delete"))] | length' tfplan.json)
          echo "changes=$CHANGES" >> "$GITHUB_OUTPUT"
          { echo "### ${{ inputs.layer }} / ${{ inputs.environment }}: $CHANGES change(s)"; echo '```'; tail -c 60000 tfplan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-output-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tflockfile-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/.terraform.lock.hcl
          include-hidden-files: true

  terraform-approve:
    name: Terraform apply approve
    runs-on: ubuntu-latest
    needs: terraform-plan
    # Required reviewers are configured on <env>-approval (prd), none on dev
    environment: ${{ inputs.environment }}-approval
    if: needs.terraform-plan.outputs.changes != '0'
    steps:
      - run: echo "Apply approved for ${{ inputs.layer }} / ${{ inputs.environment }}"

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-approve
    environment: ${{ inputs.environment }}
    concurrency: tf-${{ inputs.layer }}-${{ inputs.environment }} # one apply per state at a time
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Allow private module repo
        run: git config --global url."https://x-access-token:${{ secrets.MODULES_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Apply exactly the reviewed plan, with the same provider lock file
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - uses: actions/download-artifact@v4
        with:
          name: tflockfile-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_APPLY_OPTIONS: ${{ inputs.apply_options }}
        run: terraform apply -auto-approve -input=false -lock-timeout=5m $TF_APPLY_OPTIONS tfplan
