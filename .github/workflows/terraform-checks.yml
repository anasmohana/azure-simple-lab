name: terraform-checks

# PR gate: no Azure credentials needed
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Allow private module repo
        run: git config --global url."https://x-access-token:${{ secrets.MODULES_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: terraform fmt -check -recursive terraform
      - name: validate every layer/env
        run: |
          for dir in terraform/*/dev terraform/*/prd; do
            echo "::group::$dir"
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done
      - name: checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true # report-only in the lab; flip once findings are triaged
